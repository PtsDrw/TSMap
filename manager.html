<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Управляющий — Tiles Survive</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors">

<!-- Панель диагностики
<div id="status-banner" class="hidden bg-yellow-50 border-l-4 border-yellow-500 text-yellow-900 p-3 m-3 rounded shadow">
  <p class="font-bold mb-1"><i class="fas fa-info-circle mr-1"></i>Статус загрузки</p>
  <ul id="status-list" class="text-sm space-y-0.5"></ul>
</div> -->

<header class="flex justify-between items-center p-3 bg-white dark:bg-gray-800 shadow-md sticky top-0 z-30">
  <div class="flex items-center gap-2">
    <span class="font-bold"><i class="fas fa-user-shield text-blue-500 mr-1"></i><span id="user-name">...</span></span>
    <span id="user-badge" class="hidden text-xs bg-purple-600 text-white px-2 py-0.5 rounded">Главный</span>
  </div>
  <div class="flex items-center gap-2">
    <button id="btn-theme" class="p-2 text-xl"><i class="fas fa-moon"></i></button>
    <button id="btn-logout" class="px-3 py-1 bg-red-600 text-white rounded text-sm hover:bg-red-700"><i class="fas fa-sign-out-alt mr-1"></i>Выйти</button>
  </div>
</header>

<main class="p-2 lg:p-4">
  <!-- ВЕРХ: карта + сайдбар -->
  <div class="lg:flex lg:gap-4 lg:h-[calc(100vh-3.5rem-2rem)] lg:overflow-hidden">

    <!-- КАРТА -->
    <div class="sticky top-[52px] z-20 bg-gray-100 dark:bg-gray-900 pb-2
                lg:static lg:flex-1 lg:h-full lg:flex lg:flex-col lg:pb-0">
      <div class="flex justify-end gap-2 mb-1">
        <button id="btn-toggle-labels" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 rounded text-sm"><i class="fas fa-eye mr-1"></i>Подписи вкл</button>
        <button id="btn-download" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 rounded text-sm"><i class="fas fa-download mr-1"></i>PNG</button>
      </div>
      <div id="map-container" class="h-[40vh] lg:h-auto lg:flex-1 rounded overflow-hidden border-2 border-gray-300 dark:border-gray-600"></div>
    </div>

    <!-- САЙДБАР -->
    <aside class="lg:w-[420px] lg:h-full lg:overflow-y-auto lg:pr-1 space-y-3 mt-2 lg:mt-0">

      <!-- Раскладки -->
      <details class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
        <summary class="p-3 cursor-pointer font-semibold"><i class="fas fa-folder-open mr-2 text-yellow-500"></i>Раскладки</summary>
        <div class="px-3 pb-3">
          <button id="btn-load-layouts" class="w-full px-3 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">
            <i class="fas fa-list mr-1"></i>Открыть список
          </button>
        </div>
      </details>

      <!-- Территории -->
      <details class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden" open>
        <summary class="p-3 cursor-pointer font-semibold"><i class="fas fa-map-marker-alt mr-2 text-blue-500"></i>Территории</summary>
        <div class="px-3 pb-3 space-y-2">
          <div class="text-xs font-semibold">Режим:</div>
          <div class="flex flex-wrap gap-3 text-xs">
            <label class="flex items-center"><input type="radio" name="edit-mode" value="territory-to-alliance" checked class="mr-1">Территории → Союз</label>
            <label class="flex items-center"><input type="radio" name="edit-mode" value="alliance-to-territory" class="mr-1">Союз → Территории</label>
          </div>

          <div class="pt-2">
            <label class="block text-xs font-semibold mb-1">Активный союз:</label>
            <div class="flex gap-1">
              <select id="alliance-select" class="flex-1 border rounded p-1.5 dark:bg-gray-700 dark:border-gray-600 text-xs"></select>
              <button id="btn-apply-alliance" class="px-2 py-1.5 bg-blue-600 text-white rounded text-xs whitespace-nowrap hover:bg-blue-700"><i class="fas fa-check"></i></button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-1 pt-2">
            <button id="btn-select-all" class="px-2 py-1 bg-blue-600 text-white rounded text-xs hover:bg-blue-700"><i class="fas fa-check-square mr-1"></i>Выбрать все</button>
            <button id="btn-clear-selection" class="px-2 py-1 bg-gray-600 text-white rounded text-xs hover:bg-gray-700"><i class="fas fa-square mr-1"></i>Сбросить</button>
          </div>

          <div class="pt-1 space-y-1">
            <button id="btn-clear-selected" class="w-full px-2 py-1 bg-yellow-600 text-white rounded text-xs hover:bg-yellow-700">Очистить выбранное</button>
            <button id="btn-clear-all" class="w-full px-2 py-1 bg-red-600 text-white rounded text-xs hover:bg-red-700">Очистить всё</button>
            <button id="btn-clear-filtered" class="w-full px-2 py-1 bg-orange-600 text-white rounded text-xs hover:bg-orange-700">Очистить по фильтрам</button>
          </div>
        </div>
      </details>

      <!-- Фильтры -->
      <details class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
        <summary class="p-3 cursor-pointer font-semibold"><i class="fas fa-filter mr-2 text-cyan-500"></i>Фильтры территорий</summary>
        <div class="px-3 pb-3">
          <div class="flex gap-2 mb-2">
            <button id="btn-filters-all" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded text-xs">Выбрать все</button>
            <button id="btn-filters-none" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded text-xs">Снять все</button>
          </div>
          <div id="filters-container" class="text-xs"></div>
        </div>
      </details>

      <!-- Добавление союза -->
      <details class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden" open>
        <summary class="p-3 cursor-pointer font-semibold"><i class="fas fa-users mr-2 text-green-500"></i>Управление союзами</summary>
        <div class="px-3 pb-3">
          <button id="btn-add-alliance" class="w-full px-3 py-2 bg-green-600 text-white rounded text-sm hover:bg-green-700">
            <i class="fas fa-plus mr-1"></i>Добавить союз
          </button>
          <p class="text-xs text-gray-500 mt-2">Рейтинг союзов — внизу страницы.</p>
        </div>
      </details>

      <!-- Размещение текста -->
      <details class="bg-white dark:bg-gray-800 rounded-lg shadow overflow-hidden">
        <summary class="p-3 cursor-pointer font-semibold"><i class="fas fa-font mr-2 text-purple-500"></i>Размещение текста</summary>
        <div class="px-3 pb-3 space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <div><label class="text-xs">Смещение X</label><input type="range" id="lbl-dx" min="-30" max="30" step="1" value="0" class="w-full"></div>
            <div><label class="text-xs">Смещение Y</label><input type="range" id="lbl-dy" min="-30" max="30" step="1" value="0" class="w-full"></div>
            <div><label class="text-xs">Поворот</label><input type="range" id="lbl-rot" min="-180" max="180" step="5" value="0" class="w-full"></div>
            <div><label class="text-xs">Масштаб</label><input type="range" id="lbl-scale" min="0.3" max="3" step="0.1" value="1" class="w-full"></div>
          </div>
          <button id="btn-reset-labels" class="w-full px-2 py-1 bg-orange-600 text-white rounded text-xs"><i class="fas fa-undo mr-1"></i>Сбросить размещение</button>
        </div>
      </details>

      <!-- Сохранение/Утверждение/Выход (внизу сайдбара) -->
      <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-3 space-y-2 border-t-4 border-blue-500">
        <button id="btn-save-layout" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-semibold">
          <i class="fas fa-save mr-1"></i>Сохранить раскладку
        </button>
        <button id="btn-approve" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-semibold">
          <i class="fas fa-check mr-1"></i><span id="btn-approve-text">Утвердить</span>
        </button>
        <button id="btn-cancel" class="w-full bg-gray-600 hover:bg-gray-700 text-white py-2 rounded">
          <i class="fas fa-times mr-1"></i>Отменить и выйти
        </button>
      </div>
    </aside>
  </div>

  <!-- РЕЙТИНГ СОЮЗОВ (внизу страницы) -->
  <section class="mt-3">
    <details class="bg-white dark:bg-gray-800 rounded-lg shadow" open>
      <summary class="p-3 cursor-pointer font-semibold">
        <i class="fas fa-trophy mr-2 text-yellow-500"></i>Рейтинг союзов
      </summary>
      <div id="alliances-ranking" class="px-3 pb-3 space-y-1"></div>
    </details>
  </section>
</main>

<!-- ============ МОДАЛКИ ============ -->

<div id="modal-alliance" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-50 p-4">
  <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl w-full max-w-md">
    <h3 class="text-xl font-bold mb-4">Новый союз</h3>
    <label class="block text-sm mb-1">Клан-тег (3 символа)</label>
    <input type="text" id="al-tag" maxlength="3" class="w-full border rounded p-2 mb-3 dark:bg-gray-700 dark:border-gray-600 uppercase font-mono">
    <label class="block text-sm mb-1">Название (необязательно)</label>
    <input type="text" id="al-name" class="w-full border rounded p-2 mb-3 dark:bg-gray-700 dark:border-gray-600">
    <label class="block text-sm mb-1">Цвет</label>
    <input type="color" id="al-color" class="w-full h-10 mb-4">
    <button id="btn-save-alliance" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 mb-2">Сохранить</button>
    <button id="btn-close-alliance" class="w-full text-sm text-gray-500 hover:underline">Отмена</button>
  </div>
</div>

<div id="modal-save" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-50 p-4">
  <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl w-full max-w-md">
    <h3 class="text-xl font-bold mb-4">Сохранить раскладку</h3>
    <label class="block text-sm mb-1">Название</label>
    <input type="text" id="save-name" class="w-full border rounded p-2 mb-3 dark:bg-gray-700 dark:border-gray-600">
    <label class="block text-sm mb-1">Описание</label>
    <textarea id="save-desc" rows="3" class="w-full border rounded p-2 mb-4 dark:bg-gray-700 dark:border-gray-600"></textarea>
    <button id="btn-do-save" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 mb-2">Сохранить</button>
    <button id="btn-close-save" class="w-full text-sm text-gray-500 hover:underline">Отмена</button>
  </div>
</div>

<div id="modal-submit" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-50 p-4">
  <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl w-full max-w-md">
    <h3 class="text-xl font-bold mb-4">Отправить на утверждение</h3>
    <label class="block text-sm mb-1">Название</label>
    <input type="text" id="submit-name" class="w-full border rounded p-2 mb-3 dark:bg-gray-700 dark:border-gray-600">
    <label class="block text-sm mb-1">Описание</label>
    <textarea id="submit-desc" rows="3" class="w-full border rounded p-2 mb-4 dark:bg-gray-700 dark:border-gray-600"></textarea>
    <button id="btn-do-submit" class="w-full bg-purple-600 text-white py-2 rounded hover:bg-purple-700 mb-2">Отправить</button>
    <button id="btn-close-submit" class="w-full text-sm text-gray-500 hover:underline">Отмена</button>
  </div>
</div>

<div id="modal-layouts" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-50 p-4">
  <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-xl font-bold">Сохранённые раскладки</h3>
      <button id="btn-close-layouts" class="text-gray-500 hover:text-gray-700"><i class="fas fa-times text-xl"></i></button>
    </div>
    <div id="layouts-list"></div>
  </div>
</div>

<div id="modal-download" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-50 p-4">
  <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl w-full max-w-sm text-center">
    <h3 class="text-xl font-bold mb-4">Сохранить карту</h3>
    <button id="btn-download-labels" class="w-full bg-blue-600 text-white py-2 rounded mb-2 hover:bg-blue-700">С подписями</button>
    <button id="btn-download-plain" class="w-full bg-gray-600 text-white py-2 rounded mb-2 hover:bg-gray-700">Без подписей</button>
    <button id="btn-close-download" class="w-full text-sm text-gray-500 hover:underline mt-2">Отмена</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<script type="module" src="js/manager.js"></script>
</body>
</html>
